# The event data, the calendar feed and the status artifact are all generated
# ahead of time and committed by the nightly GitHub Action (see
# .github/workflows/nightly-sync.yml), so this is a purely static deploy.
#
# They used to be served by Netlify Functions backed by Netlify Blobs. That
# did not work: verifying ~20 store websites takes far longer than the 30
# seconds a function is allowed, so the sync was cut short every night and
# wrote pokedata's stale times back over corrections we had already made.
# Generating in CI removes the time limit entirely, and has the side benefit
# that every nightly data change is visible as a diff in the repository.

[build]
  base = "web"
  publish = "dist"
  command = "npm install && npm run build"

# Serve the calendar with the right content type so subscribing works. Without
# this it is sent as application/octet-stream and calendar clients refuse it.
[[headers]]
  for = "/calendar.ics"
  [headers.values]
    content-type = "text/calendar; charset=utf-8"
    cache-control = "public, max-age=1800"

[[headers]]
  for = "/api/events"
  [headers.values]
    content-type = "application/json; charset=utf-8"
    access-control-allow-origin = "*"

[[headers]]
  for = "/status"
  [headers.values]
    content-type = "application/json; charset=utf-8"

# SPA fallback so client-side routes don't 404 on refresh. Listed last, and
# without force, so the generated files above win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
